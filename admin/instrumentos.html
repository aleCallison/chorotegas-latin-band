<aside class="sidebar">

    <div><strong>Chorotegas Latin Band</strong><span>Administración</span></div>

  <nav class="sidebar-nav">

  </div>
</aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:10px"><button class="icon-btn mobile-admin-toggle" data-sidebar-toggle>☰</button><h1>Instrumentos</h1></div>
      <div class="admin-user"><span data-admin-user>Usuario</span><span class="tag" data-admin-role>rol</span></div>
    </header>
    <section class="admin-content">
<div class="grid grid-2">
  <div class="panel">
    <h2 style="margin-top:0">Registrar instrumento</h2>
    <form id="instrumento-form" class="auth-form">
      <div class="form-group"><label>Nombre</label><input id="instrumento-nombre" class="input" required placeholder="Ej. Trompeta"></div>
      <div class="form-group"><label>Sección</label><input id="instrumento-seccion" class="input" placeholder="Ej. Metales"></div>
      <button id="instrumento-submit" class="btn btn-primary" type="submit">Guardar</button>
    </form>
  </div>
  <div class="panel">
    <h2 style="margin-top:0">Instrumentos registrados</h2>
    <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Sección</th><th>Acciones</th></tr></thead><tbody id="instrumentos-body"><tr><td colspan="3">Cargando…</td></tr></tbody></table></div>
  </div>
</div>
</section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
