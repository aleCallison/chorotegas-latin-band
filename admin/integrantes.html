<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integrantes | Administración</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body class="admin-body">
<div class="admin-layout">

<aside class="sidebar">
  <div class="sidebar-brand">
    <img src="../assets/img/logo.png" alt="">
    <div><strong>Chorotegas Latin Band</strong><span>Administración</span></div>
  </div>
  <nav class="sidebar-nav">
    <a href="index.html">▦ Dashboard</a>
    <a href="integrantes.html">👥 Integrantes</a>
    <a href="asistencia.html">✓ Asistencia</a>
    <a href="ensayos.html">🎼 Ensayos</a>
    <a href="eventos.html">🎺 Eventos</a>
    <a href="comunicados.html">📢 Comunicados</a>
    <a href="instrumentos.html" data-admin-only>🎷 Instrumentos</a>
    <a href="usuarios.html" data-admin-only>🔑 Usuarios</a>
  </nav>
  <div class="sidebar-footer">
    <a class="btn btn-secondary" style="width:100%;margin-bottom:8px" href="../index.html">Ver sitio público</a>
    <button class="btn btn-danger" style="width:100%" data-logout>Cerrar sesión</button>
  </div>
</aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <div style="display:flex;align-items:center;gap:10px"><button class="icon-btn mobile-admin-toggle" data-sidebar-toggle>☰</button><h1>Integrantes</h1></div>
      <div class="admin-user"><span data-admin-user>Usuario</span><span class="tag" data-admin-role>rol</span></div>
    </header>
    <section class="admin-content">
<div class="toolbar">
  <input id="integrante-search" class="input search" placeholder="Buscar integrante…">
  <button id="nuevo-integrante" class="btn btn-primary" data-open-modal="integrante-modal">+ Nuevo integrante</button>
</div>
<div class="table-wrap"><table>
<thead><tr><th>Nombre</th><th>Instrumento</th><th>Sección</th><th>Ingreso</th><th>Estado</th><th>Acciones</th></tr></thead>
<tbody id="integrantes-body"><tr><td colspan="6">Cargando…</td></tr></tbody>
</table></div>

<div class="modal" id="integrante-modal">
  <div class="modal-card">
    <div class="modal-head"><h2 id="integrante-modal-title">Nuevo integrante</h2><button class="icon-btn" data-close-modal="integrante-modal">✕</button></div>
    <div class="modal-body">
      <form id="integrante-form" class="form-grid">
        <div class="form-group"><label>Nombres</label><input id="integrante-nombres" class="input" required></div>
        <div class="form-group"><label>Apellidos</label><input id="integrante-apellidos" class="input" required></div>
        <div class="form-group"><label>Alias / apodo</label><input id="integrante-alias" class="input"></div>
<div class="form-group"><label>Foto PNG</label><input id="integrante-foto" class="input" placeholder="Ej. assets/img/integrantes/juan.png"></div>
        <div class="form-group"><label>Instrumento</label><select id="integrante-instrumento" class="input"></select></div>
        <div class="form-group"><label>Sección</label><input id="integrante-seccion" class="input" placeholder="Metales, ritmo, saxofones…"></div>
        <div class="form-group"><label>Fecha de ingreso</label><input id="integrante-fecha" class="input" type="date"></div>
        <div class="form-group span-2"><label>Cuenta de usuario vinculada</label><select id="integrante-usuario" class="input"></select></div>
        <label class="span-2" style="display:flex;gap:10px;align-items:center"><input id="integrante-activo" type="checkbox" checked> Integrante activo</label>
        <div class="span-2 actions"><button class="btn btn-primary" type="submit">Guardar</button><button class="btn btn-secondary" type="button" data-close-modal="integrante-modal">Cancelar</button></div>
      </form>
    </div>
  </div>
</div>
</section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/core.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/integrantes.js"></script>
</body></html>
